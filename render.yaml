services:
  - type: web
    name: birooni-licensing-api
    runtime: docker
    plan: free
    region: singapore # or oregon, frankfurt based on preference
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        sync: false # Set securely in Render dashboard
      - key: RSA_PRIVATE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PUBLIC_WEB_URL
        value: https://ibrooni.com
